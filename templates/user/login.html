{% extends "base.html" %}

{% block title %}Login - Floranest{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required class="form-control">
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Password</label>
                <input type="password" name="password" required class="form-control">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.875rem;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-green); font-weight: 600;">Register here</a>
        </p>
        <p style="text-align: center; margin-top: 1rem; color: var(--text-light); font-size: 0.75rem;">
            Admin credentials: admin / admin123
        </p>
    </div>
</section>
{% endblock %}
