{% extends "base.html" %}

{% block title %}Login - Floranest{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Access your botanical collection</p>
        
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required class="form-control" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required class="form-control" placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 2rem;">Sign In</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
            <p style="margin-top: 1.5rem; font-size: 0.75rem; opacity: 0.7;">Demo Admin: admin / admin123</p>
        </div>
    </div>
</section>
{% endblock %}
