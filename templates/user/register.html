{% extends "base.html" %}

{% block title %}Register - Floranest{% endblock %}

{% block content %}
<section class="container" style="padding: 6rem 0; display: flex; justify-content: center;">
    <div style="background: white; padding: 3rem; border-radius: 1rem; box-shadow: var(--shadow); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
        <form method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Username</label>
                <input type="text" name="username" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;">
            </div>
            <div style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.875rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-green); font-weight: 600;">Login here</a>
        </p>
    </div>
</section>
{% endblock %}
