{% extends "base.html" %}

{% block title %}Register - Floranest{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Join Floranest</h2>
        <p class="subtitle">Start your journey with nature</p>
        
        <form method="POST">
            <div class="form-group">
                <label for="username">Choose Username</label>
                <input type="text" id="username" name="username" required class="form-control" placeholder="e.g. green_thumb">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required class="form-control" placeholder="nature@example.com">
            </div>
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" required class="form-control" placeholder="Min. 8 characters">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="form-control" placeholder="Repeat your password">
            </div>
            
            <button type="submit" class="btn-primary btn-block" style="margin-top: 2rem;">
                Create Account
                <span class="blob-btn__inner">
                    <span class="blob-btn__blobs">
                        <span class="blob-btn__blob"></span>
                        <span class="blob-btn__blob"></span>
                        <span class="blob-btn__blob"></span>
                        <span class="blob-btn__blob"></span>
                    </span>
                </span>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already a member? <a href="{{ url_for('login') }}">Sign In</a></p>
        </div>
    </div>
</section>
{% endblock %}
